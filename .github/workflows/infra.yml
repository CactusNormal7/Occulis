name: Infra (manuel)

# Déclenchement manuel des actions de tooling/infra (wrangler/D1) sans poste local
# allumé : la TUI (pnpm infra) reste l'outil de référence, ce workflow réutilise le
# même catalogue d'actions (src/actions.ts) via src/ci.ts, sa variante non interactive.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action infra à exécuter"
        required: true
        type: choice
        options:
          - status
          - list
          - create-db
          - create-branch-env
          - delete-branch-env
          - migrate
          - deploy
          - sql
          - info
          - deployments
      branch:
        description: "Branche de travail — create-branch-env : celle dont on crée l'environnement ; delete-branch-env : celle où committer le retrait (vide = branche depuis laquelle ce workflow est lancé)"
        required: false
        type: string
      env:
        description: "Environnement wrangler : staging, production, ou le slug d'une branche — requis pour create-db / migrate / deploy / sql / info / deployments, et pour delete-branch-env où il désigne l'environnement À SUPPRIMER"
        required: false
        type: string
      query:
        description: "Requête SQL (action sql) ou confirmation (delete-branch-env : retaper l'environnement ciblé, ou le nom de sa branche)"
        required: false
        type: string

permissions:
  contents: write

# Deux déclenchements de la même action sur la même cible ne doivent pas se chevaucher
# (ex: deux migrations concurrentes) ; des actions ou cibles différentes, si. `deploy` et
# `migrate` partagent en plus le groupe `deploy-<env>` du job de déploiement de ci.yml :
# un push et un déploiement manuel ne touchent jamais le même environnement ensemble.
concurrency:
  group: ${{ (inputs.action == 'deploy' || inputs.action == 'migrate') && format('deploy-{0}', inputs.env) || format('infra-{0}-{1}', inputs.action, inputs.branch || inputs.env || github.ref) }}

jobs:
  infra:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    # L'environnement GitHub visé, comme le job de déploiement de ci.yml : ses règles de
    # protection (approbation de la production) valent aussi pour une action manuelle.
    # Sans `env` (statut, liste, création d'environnement), aucun.
    environment: ${{ inputs.env }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      # actions/checkout laisse HEAD détaché : create-branch-env dérive l'environnement du
      # nom de branche courant, et les deux actions committent puis poussent le manifeste
      # (src/git.ts, currentBranch) — il leur faut une vraie branche locale, pas un détaché.
      # delete-branch-env, lui, prend sa cible dans `env` : il supprime n'importe quel
      # environnement depuis n'importe quelle branche.
      - name: Basculer sur la branche de travail
        if: inputs.action == 'create-branch-env' || inputs.action == 'delete-branch-env'
        env:
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
        run: git checkout -B "$TARGET_BRANCH"

      - name: Identité git pour le commit du manifeste
        if: inputs.action == 'create-branch-env' || inputs.action == 'delete-branch-env'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Un environnement se déploie et se migre depuis la branche que le manifeste lui
      # attribue, et d'aucune autre : sinon du code non fusionné partirait en production.
      - name: Vérifier la branche de l'environnement
        if: inputs.action == 'deploy' || inputs.action == 'migrate'
        env:
          TARGET_ENV: ${{ inputs.env }}
          SOURCE_BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          owner=$(jq -r --arg e "$TARGET_ENV" \
            'to_entries[] | select(.value.wranglerEnv == $e) | .key' .github/deploy-environments.json)
          if [ -n "$owner" ] && [ "$owner" != "$SOURCE_BRANCH" ]; then
            echo "::error::« $TARGET_ENV » se déploie depuis « $owner », pas depuis « $SOURCE_BRANCH »."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Exécuter l'action
        working-directory: tooling/infra
        env:
          INFRA_ACTION: ${{ inputs.action }}
          INFRA_ENV: ${{ inputs.env }}
          INFRA_QUERY: ${{ inputs.query }}
        # Pas de « -- » : contrairement à npm, pnpm le transmet tel quel au script
        # sous-jacent plutôt que de le n'utiliser que comme séparateur.
        run: pnpm run ci "$INFRA_ACTION" "$INFRA_ENV" "$INFRA_QUERY"
