<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Occulis — profile</title>
    <!-- Le fond et le thème sombre sont injectés au build, en tête de <head>
         (`criticalPaint`, vite.config.ts) : aucune couleur écrite ici. -->
    <style>
      html,
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!--
      La page de profil : une page à part, sans canevas ni moteur de jeu, comme le
      back-office. Ce qu'elle montre et modifie est borné côté serveur au compte de la
      session (`apps/server/src/me/routes.ts`).
    -->
    <div id="profile"></div>
    <!-- Bloque le rendu jusqu'à son exécution : il doit écouter `pagereveal` avant la
         première image (`load/page.tsx`). -->
    <script type="module" blocking="render" src="/src/profile/main.tsx"></script>
  </body>
</html>
