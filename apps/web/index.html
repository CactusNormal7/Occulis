<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Occulis</title>
    <link rel="stylesheet" href="/src/ui/ui.css" />
    <style>
      /* Doit rester synchronisé avec BACKGROUND dans src/theme.ts. */
      html, body { margin: 0; height: 100%; background: #0d0f12; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- Le canevas de jeu, montré seulement une fois la partie commencée : il n'y a
         aucune partie locale à faire tourner derrière le menu. -->
    <div id="app" hidden></div>

    <!--
      Les écrans hors partie. En HTML et non dessinés dans le canevas : des champs natifs
      donnent gratuitement le focus, la saisie, l'autocomplétion et l'accessibilité.
      L'écran de compte a migré sur la charte (`@occulis/ui`) ; les autres suivront.
    -->
    <!-- Visible sur tous les écrans, partie comprise : jouer sous un nom d'emprunt ne
         doit jamais passer inaperçu. -->
    <aside id="impersonation" role="status" hidden>
      <span data-i18n="game.impersonation.text">Impersonation session: you are playing as</span>
      <strong id="impersonated"></strong>
      <button id="stop-impersonating" type="button" data-i18n="game.impersonation.stop">Back to my account</button>
    </aside>

    <!-- Le compte, en haut à droite : le lien vers le profil n'est pas un geste de jeu, il
         n'a pas sa place parmi les entrées du menu. Montré au seul écran de menu. -->
    <a id="account-corner" href="/profile/" aria-label="My profile" data-i18n-label="game.myProfile" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
      </svg>
      <span id="account-corner-name"></span>
    </a>

    <!-- Le choix de langue, hors partie seulement : en partie, il n'y a rien à relire. -->
    <nav id="locale-switch" aria-label="Language" data-i18n-label="ui.language" hidden>
      <button type="button" data-locale="en" lang="en">EN</button>
      <button type="button" data-locale="fr" lang="fr">FR</button>
    </nav>

    <main id="shell">
      <!-- Compte : connexion, inscription, mot de passe oublié, réinitialisation. Un îlot
           React sur la charte (`src/account/`), un formulaire et une URL par parcours. -->
      <section id="screen-auth" class="screen" hidden>
        <div id="account-root" class="panel"></div>
      </section>

      <!-- Menu : les trois façons d'entrer en partie. -->
      <section id="screen-menu" class="screen" hidden>
        <div class="panel">
          <h1>Occulis</h1>
          <p id="menu-identity" class="tagline"></p>
          <button id="account-resend" type="button" data-i18n="game.menu.resend" hidden>
            Resend the verification email
          </button>

          <div class="choices">
            <button id="play-quick" type="button" class="primary">
              <span data-i18n="game.menu.quick">Quick match</span>
              <small data-i18n="game.menu.quickHint">The first available opponent</small>
            </button>
            <button id="play-host" type="button" class="primary">
              <span data-i18n="game.menu.host">Create a match</span>
              <small data-i18n="game.menu.hostHint">A code to give to your opponent</small>
            </button>
          </div>

          <form id="join-form" autocomplete="off">
            <label class="field">
              <span data-i18n="game.menu.join">Join a match</span>
              <input
                id="join-code"
                type="text"
                name="code"
                maxlength="5"
                placeholder="CODE"
                data-i18n-placeholder="game.menu.codePlaceholder"
                spellcheck="false"
              />
            </label>
            <button id="play-join" type="submit" data-i18n="game.menu.joinButton">Join</button>
          </form>

          <p id="menu-notice" role="status"></p>
          <div class="menu-links">
            <a id="menu-admin" class="quiet" href="/admin/" data-i18n="game.menu.admin" hidden>Back office</a>
            <button id="account-signout" type="button" class="quiet" data-i18n="game.menu.signOut">Sign out</button>
          </div>
        </div>
      </section>

      <!-- Attente d'un adversaire, appariement ou salon privé. -->
      <section id="screen-waiting" class="screen" hidden>
        <div class="panel">
          <h1>Occulis</h1>
          <p id="waiting-code" class="code" hidden></p>
          <button id="waiting-copy" type="button" class="quiet" hidden>Copy</button>
          <p id="waiting-note" role="status"></p>
          <button id="waiting-cancel" type="button" class="quiet" data-i18n="game.waiting.cancel">Cancel</button>
        </div>
      </section>
    </main>

    <!--
      Bandeau de partie : état du tour, lecture de case et saisie de coups. Le clavier
      reste seul capable d'enchaîner déplacement et capture dans le même tour.
    -->
    <section id="console" aria-label="Match in progress" data-i18n-label="game.console.label" hidden>
      <p id="status"></p>
      <p id="tile-readout"></p>
      <form id="command-form" autocomplete="off">
        <label for="command-input" data-i18n="game.console.move">Move</label>
        <input
          id="command-input"
          name="command"
          type="text"
          placeholder="1,6 2,5"
          aria-describedby="command-help"
        />
      </form>
      <p id="command-log" data-state="ok"></p>
      <p id="command-help">
        <code>1,6 2,5</code> <span data-i18n="game.console.help.move">moves</span> ·
        <code data-i18n="game.console.help.resign">resign</code>
      </p>
      <button id="leave-match" type="button" class="quiet" data-i18n="game.console.leave">Leave the match</button>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
