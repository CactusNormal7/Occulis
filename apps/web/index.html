<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Occulis</title>
    <link rel="stylesheet" href="/src/ui/ui.css" />
    <!-- Le fond et le thème sombre sont injectés au build, en tête de <head>
         (`criticalPaint`, vite.config.ts) : aucune couleur écrite ici. -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- Le canevas de jeu, montré seulement une fois la partie commencée : il n'y a
         aucune partie locale à faire tourner derrière le menu. -->
    <div id="app" hidden></div>

    <!--
      Les écrans hors partie. En HTML et non dessinés dans le canevas : des champs natifs
      donnent gratuitement le focus, la saisie, l'autocomplétion et l'accessibilité.
      L'écran de compte a migré sur la charte (`@occulis/ui`) ; les autres suivront.
    -->
    <!-- Visible sur tous les écrans, partie comprise : jouer sous un nom d'emprunt ne
         doit jamais passer inaperçu. -->
    <aside id="impersonation" role="status" hidden>
      <span data-i18n="game.impersonation.text">Impersonation session: you are playing as</span>
      <strong id="impersonated"></strong>
      <button id="stop-impersonating" type="button" data-i18n="game.impersonation.stop">Back to my account</button>
    </aside>

    <!-- En haut à droite, hors des gestes de jeu : le compte (au seul écran de menu) et
         l'engrenage des réglages d'affichage (partout sauf les écrans pleine page, partie
         comprise — c'est sur le plateau qu'un design se juge). -->
    <div id="corner-tools">
      <a id="account-corner" href="/profile/" aria-label="My profile" data-i18n-label="game.myProfile" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
        </svg>
        <span id="account-corner-name"></span>
      </a>
      <button
        id="settings-toggle"
        type="button"
        aria-label="Settings"
        data-i18n-label="ui.settings.label"
        aria-expanded="false"
        aria-controls="settings"
        hidden
      >
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" />
          <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" />
        </svg>
      </button>

      <!-- Les réglages : une fenêtre flottante, non modale, qui se construit en petits
           carrés (`pixelReveal`). Échap, l'engrenage ou un clic ailleurs la referment. -->
      <section id="settings" role="dialog" aria-labelledby="settings-title" hidden>
        <h2 id="settings-title" data-i18n="ui.settings.title">Settings</h2>
        <div class="settings__group" role="group" aria-labelledby="settings-design">
          <h3 id="settings-design" data-i18n="ui.theme.label">Design</h3>
          <button type="button" class="settings__choice" data-theme-choice="obsidian">
            <i aria-hidden="true"></i>
            <span><strong data-i18n="ui.theme.names.obsidian">Obsidian</strong><small data-i18n="ui.theme.hints.obsidian">Black and bone, cold glows — the severe one</small></span>
          </button>
          <button type="button" class="settings__choice" data-theme-choice="reliquary">
            <i aria-hidden="true"></i>
            <span><strong data-i18n="ui.theme.names.reliquary">Reliquary</strong><small data-i18n="ui.theme.hints.reliquary">Warm black, old gold, fireflies and a turning seal</small></span>
          </button>
          <button type="button" class="settings__choice" data-theme-choice="astral">
            <i aria-hidden="true"></i>
            <span><strong data-i18n="ui.theme.names.astral">Astral</strong><small data-i18n="ui.theme.hints.astral">A dense sky: constellations, shooting stars, nebulae</small></span>
          </button>
        </div>
        <div class="settings__group" role="group" aria-labelledby="settings-language">
          <h3 id="settings-language" data-i18n="ui.language">Language</h3>
          <div class="settings__locales">
            <button type="button" data-locale="en" lang="en">English</button>
            <button type="button" data-locale="fr" lang="fr">Français</button>
          </div>
        </div>
      </section>
    </div>

    <main id="shell">
      <!-- L'amorce : visible dès le HTML, avant tout script, jusqu'à ce que le premier écran
           soit complet. Rien que la barre de chargement de la charte, après un délai : un
           encadré d'attente serait lui-même un morceau qui paraît avant le reste. -->
      <section id="screen-boot" class="screen" role="status" aria-busy="true" aria-label="Loading…" data-i18n-label="ui.loading">
        <div class="occ-progress" data-active="true" aria-hidden="true"></div>
      </section>

      <!-- Compte : connexion, inscription, mot de passe oublié, réinitialisation. Un îlot
           React sur la charte (`src/account/`), un formulaire et une URL par parcours. -->
      <section id="screen-auth" class="screen" hidden>
        <div id="account-root" class="panel"></div>
      </section>

      <!-- Menu : les trois façons d'entrer en partie. -->
      <section id="screen-menu" class="screen" hidden>
        <div class="panel">
          <h1>Occulis</h1>
          <p id="menu-identity" class="tagline"></p>
          <button id="account-resend" type="button" data-i18n="game.menu.resend" hidden>
            Resend the verification email
          </button>

          <!-- Les trois entrées en partie, une carte chacune : même forme, même poids,
               sauf la partie rapide, le geste attendu par défaut. -->
          <section class="menu-section" aria-labelledby="menu-play-title">
            <h2 id="menu-play-title" class="menu-heading" data-i18n="game.menu.play">Play</h2>
            <div class="choices">
              <button id="play-quick" type="button" class="primary primary--lead">
                <span data-i18n="game.menu.quick">Quick match</span>
                <small data-i18n="game.menu.quickHint">The first available opponent</small>
              </button>
              <button id="play-host" type="button" class="primary">
                <span data-i18n="game.menu.host">Create a match</span>
                <small data-i18n="game.menu.hostHint">A code to give to your opponent</small>
              </button>
              <form id="join-form" class="primary" autocomplete="off">
                <label for="join-code" data-i18n="game.menu.join">Join a match</label>
                <div class="join-row">
                  <input
                    id="join-code"
                    type="text"
                    name="code"
                    maxlength="5"
                    placeholder="CODE"
                    data-i18n-placeholder="game.menu.codePlaceholder"
                    spellcheck="false"
                  />
                  <button id="play-join" type="submit" data-i18n="game.menu.joinButton">Join</button>
                </div>
              </form>
            </div>

            <!-- Les équipes préparées d'avance : ce n'est pas une entrée en partie, mais ce
                 qu'on emporte dans chacune — d'où une carte en retrait, sous les trois autres. -->
            <button id="menu-teams" type="button" class="primary primary--minor">
              <span data-i18n="team.presets.menuEntry">Teams</span>
              <small data-i18n="team.presets.menuHint">Prepare your line-ups</small>
            </button>

            <p id="menu-notice" role="status"></p>
          </section>

          <!-- Amis : défis reçus, présence, défier, regarder. La gestion de la liste et
               les messages vivent dans le profil. Masqué tant que la liste n'est pas lue. -->
          <section id="menu-friends" class="menu-section friends" data-i18n-label="social.menu.title" aria-label="Friends" hidden>
            <div class="menu-section__head">
              <h2 class="menu-heading" data-i18n="social.menu.title">Friends</h2>
              <a class="menu-link" href="/profile/#/friends" data-i18n="social.menu.manage">Manage · messages</a>
            </div>
            <ul id="friends-challenges" class="friend-list"></ul>
            <ul id="friends-list" class="friend-list"></ul>
            <p id="friends-empty" class="friends__empty" data-i18n="social.menu.empty">
              No friends yet: add some from your profile.
            </p>
          </section>
          <!-- Pied de panneau : les gestes de compte, hors du jeu, en simples liens. La
               déconnexion à droite, à l'écart de tout le reste. -->
          <footer class="menu-links">
            <a id="menu-admin" class="menu-link" href="/admin/" data-i18n="game.menu.admin" hidden>Back office</a>
            <button id="account-signout" type="button" class="menu-link" data-i18n="game.menu.signOut">Sign out</button>
          </footer>
        </div>
      </section>

      <!-- Attente d'un adversaire, appariement ou salon privé. -->
      <section id="screen-waiting" class="screen" hidden>
        <div class="panel">
          <h1>Occulis</h1>
          <!-- L'attente : un œil de huit pixels qui tourne, le temps qu'un adversaire paraisse. -->
          <div class="waiting-orbit" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <p id="waiting-code" class="code" hidden></p>
          <button id="waiting-copy" type="button" class="quiet" hidden>Copy</button>
          <p id="waiting-note" role="status"></p>
          <button id="waiting-cancel" type="button" class="quiet" data-i18n="game.waiting.cancel">Cancel</button>
        </div>
      </section>

      <!-- Le déploiement : annonce de l'adversaire, puis composition et placement de
           l'équipe. Un îlot React sur la charte (`src/prepare/`). -->
      <section id="screen-deploy" class="screen screen--page" hidden>
        <div id="deploy-root"></div>
      </section>

      <!-- Les équipes préparées, depuis le menu (`src/teams/`). -->
      <section id="screen-teams" class="screen screen--page" hidden>
        <div id="teams-root"></div>
      </section>
    </main>

    <!-- La fenêtre « partie trouvée », modale, au-dessus de l'écran d'attente. -->
    <div id="match-found-root"></div>

    <!--
      Bandeau de partie : état du tour, lecture de case et saisie de coups. Le clavier
      reste seul capable d'enchaîner déplacement et capture dans le même tour.
    -->
    <section id="console" aria-label="Match in progress" data-i18n-label="game.console.label" hidden>
      <p id="status"></p>
      <p id="tile-readout"></p>
      <form id="command-form" autocomplete="off">
        <label for="command-input" data-i18n="game.console.move">Move</label>
        <input
          id="command-input"
          name="command"
          type="text"
          placeholder="1,6 2,5"
          aria-describedby="command-help"
        />
      </form>
      <p id="command-log" data-state="ok"></p>
      <p id="command-help">
        <code>1,6 2,5</code> <span data-i18n="game.console.help.move">moves</span> ·
        <code data-i18n="game.console.help.resign">resign</code>
      </p>
      <button id="leave-match" type="button" class="quiet" data-i18n="game.console.leave">Leave the match</button>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
