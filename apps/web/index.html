<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Occulis</title>
    <link rel="stylesheet" href="/src/ui/console.css" />
    <style>
      /* Doit rester synchronisé avec BACKGROUND dans src/theme.ts. */
      html, body { margin: 0; height: 100%; background: #0d0f12; overflow: hidden; }
      #app { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!--
      Saisie de coups. Volontairement en HTML et non dessinée dans le canevas :
      aucun design system n'est acté (docs/design.md 8.1), et une entrée texte
      native donne gratuitement le focus, la sélection et l'historique du champ.
    -->
    <section id="console" aria-label="Saisie de coups">
      <!--
        Mise en file d'attente. Le hot-seat reste le mode par défaut : tant qu'aucun
        adversaire n'est trouvé, la démonstration locale continue de tourner.
      -->
      <!--
        Compte. Provisoire comme le reste de la console : aucun design system n'est
        acté (docs/design.md 8.1). Le jeton de session vit dans un cookie HttpOnly,
        donc aucun script de cette page ne peut le lire.
      -->
      <form id="account-form" autocomplete="on">
        <input id="account-email" type="email" name="email" placeholder="adresse" autocomplete="email" />
        <input id="account-password" type="password" name="password" placeholder="mot de passe" autocomplete="current-password" />
        <input id="account-handle" type="text" name="handle" placeholder="pseudo (inscription)" autocomplete="nickname" />
        <button id="account-signin" type="submit">Se connecter</button>
        <button id="account-register" type="button">Créer un compte</button>
        <button id="account-forgot" type="button">Mot de passe oublié</button>
      </form>

      <!--
        Choix d'un nouveau mot de passe. N'apparaît qu'au retour du lien reçu par
        courrier, qui ramène ici avec le jeton en paramètre d'URL.
      -->
      <form id="reset-form" autocomplete="on" hidden>
        <input
          id="reset-password"
          type="password"
          name="new-password"
          placeholder="nouveau mot de passe"
          autocomplete="new-password"
        />
        <button id="reset-submit" type="submit">Choisir ce mot de passe</button>
      </form>
      <p id="lobby">
        <button id="account-signout" type="button" hidden>Se déconnecter</button>
        <button id="play-online" type="button" disabled>Jouer en ligne</button>
        <button id="leave-online" type="button" hidden>Quitter</button>
        <span id="account-status"></span>
        <button id="account-resend" type="button" hidden>Renvoyer le message de vérification</button>
        <span id="lobby-status"></span>
      </p>
      <p id="status"></p>
      <p id="tile-readout"></p>
      <form id="command-form" autocomplete="off">
        <label for="command-input">Coup</label>
        <input
          id="command-input"
          name="command"
          type="text"
          placeholder="1,6 2,5"
          aria-describedby="command-help"
        />
      </form>
      <p id="command-log" data-state="ok"></p>
      <p id="command-help">
        <code>1,6 2,5</code> déplace · <code>1,6 2,5 x 3,5</code> capture ·
        <code>1,6 x 1,5</code> frappe sur place · <code>abandon</code>
      </p>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
