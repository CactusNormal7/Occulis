# Une branche = un environnement complet (docs/architecture.md section 4).
# Les `database_id` sont produits par `wrangler d1 create` — voir docs/setup.md.

name = "occulis"
main = "src/index.ts"
compatibility_date = "2026-08-27"

# Exigé par @cloudflare/vitest-pool-workers, qui exécute les tests dans workerd avec
# cette configuration. Le drapeau ne fait qu'ajouter les API Node disponibles : le code
# du Worker n'en utilise aucune, et son comportement est inchangé.
compatibility_flags = ["nodejs_compat"]

# Minifié : 2,2 Mo → 1 Mo envoyés (281 Kio gzip au lieu de 414), donc moins à analyser au
# démarrage à froid. Les source maps envoyées avec rendent les piles d'erreur lisibles.
minify = true
upload_source_maps = true

[assets]
directory = "../web/dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchDO"

# File d'attente globale : une seule instance pour tout le service, son mono-threading
# écarte le double appariement (docs/architecture.md section 2).
[[durable_objects.bindings]]
name = "QUEUE"
class_name = "QueueDO"

# Un canal social par joueur (`idFromName(playerId)`) : présence, poussées, défis.
[[durable_objects.bindings]]
name = "SOCIAL"
class_name = "SocialDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["QueueDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SocialDO"]

[[d1_databases]]
binding = "DB"
database_name = "occulis-local"
database_id = "local"

# Ménage nocturne (`src/maintenance.ts`) : sessions périmées, jetons de vérification
# expirés, compteurs de débit retombés, profils orphelins et messages de plus de 90 jours.
# Aucun n'est visible du joueur, et rien ne les effacerait autrement.
# `triggers` n'est pas hérité par les environnements nommés : chacun redéclare le sien.
[triggers]
crons = ["0 4 * * *"]

# Local et tests seulement : sans clé Resend, les courriers s'écrivent dans la console,
# liens de vérification et de réinitialisation compris. `vars` n'étant **pas hérité**
# par les environnements nommés, recette, production et branches ne l'ont jamais : un
# jeton de réinitialisation ne doit pas finir dans des journaux hébergés.
[vars]
MAIL_TO_CONSOLE = "on"

# Workers Logs : ce que `console.error` écrit (`append-failed`, `outcome-failed`,
# `purge-failed`, `start-match-failed`…) reste consultable après coup, quand `wrangler tail`
# ne montre que le direct. Le plan gratuit en garde un volume quotidien limité, que ces
# seuls journaux d'échec sont loin d'atteindre. Identifiants seulement, jamais de position.
[observability]
enabled = true

# --- Recette -----------------------------------------------------------------
[env.staging]
name = "occulis-staging"

# Un seul niveau sous la zone, comme la production : `staging.occulis.0kl.fr` en aurait deux
# et ne serait couvert par aucun certificat (vérifié en pratique).
routes = [{ pattern = "occulis-staging.0kl.fr", custom_domain = true }]

[env.staging.assets]
directory = "../web/dist"
binding = "ASSETS"

[[env.staging.durable_objects.bindings]]
name = "MATCH"
class_name = "MatchDO"

[[env.staging.durable_objects.bindings]]
name = "QUEUE"
class_name = "QueueDO"

[[env.staging.durable_objects.bindings]]
name = "SOCIAL"
class_name = "SocialDO"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "occulis-staging"
database_id = "b0c5894c-1032-4ef4-9647-b9ff1ce9048b"

[env.staging.triggers]
crons = ["0 4 * * *"]

# Un environnement hébergé n'écrit jamais un courrier dans ses journaux (`auth/mail.ts`).
[env.staging.vars]
MAIL_TO_CONSOLE = "off"

# --- Production --------------------------------------------------------------
[env.production]
name = "occulis-production"

# `custom_domain = true` fait créer par wrangler l'enregistrement DNS et le rattachement
# au déploiement : rien à cliquer dans le dashboard. La zone 0kl.fr doit appartenir au
# compte, et le token de la CI porter Zone:Workers Routes:Edit et Zone:Zone:Read en plus
# des permissions Workers/D1.
#
# Un seul niveau sous la zone, délibérément : le certificat universel de Cloudflare couvre
# `0kl.fr` et `*.0kl.fr`, mais pas `*.*.0kl.fr`. Un nom du type `beta.occulis.0kl.fr`
# exigerait Advanced Certificate Manager (payant) — d'où le schéma plat retenu en
# section 4 de docs/architecture.md.
routes = [{ pattern = "occulis.0kl.fr", custom_domain = true }]

[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"

[[env.production.durable_objects.bindings]]
name = "MATCH"
class_name = "MatchDO"

[[env.production.durable_objects.bindings]]
name = "QUEUE"
class_name = "QueueDO"

[[env.production.durable_objects.bindings]]
name = "SOCIAL"
class_name = "SocialDO"

[[env.production.d1_databases]]
binding = "DB"
database_name = "occulis-prod"
database_id = "a26529e1-ba11-4c6f-9ba8-4865a3b0c6af"

[env.production.triggers]
crons = ["0 4 * * *"]

# Un environnement hébergé n'écrit jamais un courrier dans ses journaux (`auth/mail.ts`).
[env.production.vars]
MAIL_TO_CONSOLE = "off"
